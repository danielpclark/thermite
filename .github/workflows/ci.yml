name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner images are pinned: newer images (e.g. ubuntu-26.04) have no builds of the old Rubies
# that Thermite and Rutie 0.10 support.
jobs:
  lint:
    name: RuboCop and YARD
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rake rubocop yard

  test:
    name: Test (Ruby ${{ matrix.ruby }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        ruby: ['2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
        exclude:
          # Ruby 2.5 cannot be built for macOS on arm64.
          - os: macos-15
            ruby: '2.5'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  rutie:
    name: Rutie 0.10.2 integration (Ruby ${{ matrix.ruby }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        # The Rubies supported by Rutie 0.10.
        ruby: ['2.5', '2.6', '2.7']
        exclude:
          # Ruby 2.5 cannot be built for macOS on arm64.
          - os: macos-15
            ruby: '2.5'
    env:
      THERMITE_RUTIE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Show toolchain versions
        run: |
          ruby -v
          cargo -V
          rustc -V
      - run: bundle exec rake test
      # Temporary: diagnoses how the Rutie fixture links libruby on macOS.
      - name: Show Rutie fixture linkage
        if: failure() && runner.os == 'macOS'
        run: |
          ruby -e 'p RbConfig::CONFIG.values_at("ENABLE_SHARED", "LIBRUBY_SO", "LIBRUBYARG_SHARED", "DLDFLAGS", "libdir")'
          otool -L "$(ruby -e 'print RbConfig.ruby')"
          cp -R test/fixtures/rutie_extension "$RUNNER_TEMP/rutie_extension"
          cd "$RUNNER_TEMP/rutie_extension"
          export RUBY="$(ruby -e 'print RbConfig.ruby')"
          for flags in none dldflags; do
            echo "::group::cargo rustc ($flags)"
            if [ "$flags" = none ]; then
              cargo rustc --release --lib --target-dir "target-$flags" -vv 2>&1 | grep -E 'rustc-link|warning' || true
            else
              cargo rustc --release --lib --target-dir "target-$flags" -vv -- -C "link-args=$(ruby -e 'print RbConfig::CONFIG["DLDFLAGS"]')" 2>&1 | grep -E 'rustc-link|warning' || true
            fi
            lib="target-$flags/release/librutie_thermite_example.dylib"
            otool -L "$lib"
            nm -u "$lib" | grep -E '_rb_cObject|_rb_define_class' || true
            dyld_info -fixups "$lib" 2>/dev/null | grep -E 'rb_cObject' || true
            echo "::endgroup::"
          done
