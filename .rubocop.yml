AllCops:
  Exclude:
  - 'vendor/**/*'
  NewCops: enable
  TargetRubyVersion: 2.5

Layout/EmptyLineAfterMagicComment:
  Enabled: false

Layout/EndAlignment:
  Enabled: true
  EnforcedStyleAlignWith: variable

Layout/LineLength:
  Max: 100
  AllowURI: true
  URISchemes:
  - http
  - https

Metrics/AbcSize:
  Max: 20

Metrics/ClassLength:
  Exclude:
  - 'test/**/*'
  Max: 150

Metrics/MethodLength:
  Max: 20
