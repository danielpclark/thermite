AllCops:
  Exclude:
  - 'vendor/**/*'
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 2.5

# Development dependencies stay in the gemspec, as they always have.
Gemspec/DevelopmentDependencies:
  Enabled: false

Layout/EmptyLineAfterMagicComment:
  Enabled: false

Layout/EndAlignment:
  Enabled: true
  EnforcedStyleAlignWith: variable

Layout/LineLength:
  Max: 100
  AllowURI: true
  URISchemes:
  - http
  - https

Metrics/AbcSize:
  Max: 20

Metrics/ClassLength:
  Exclude:
  - 'test/**/*'
  Max: 150

Metrics/MethodLength:
  Max: 20

# `install` methods answer whether they installed anything; `system` mirrors Kernel#system.
Naming/PredicateMethod:
  Enabled: false
